# pyshop benchmark - planted bugs.
#
# The folder src/ is the CLEAN twin. The BUGGY variant is generated by applying
# every bug below: `find` must occur exactly once in `file` and is replaced by
# `replace`. Line numbers are computed on the generated buggy file.
#
# scope = "lines"     a finding matches if it points within `tolerance` lines of the change
# scope = "function"  a finding matches anywhere inside the enclosing function
#
# Never add hints (comments, names) to `replace` that give the bug away.

name = "pyshop"
version = "1"
language = "python"
description = "Online shop backend: auth, users, orders, payments, invoices (~450 lines, 15 planted bugs)"

[[bug]]
id = "sql-injection-user-search"
file = "app/users.py"
kind = "security"
cwe = "CWE-89"
title = "SQL injection: search term interpolated into the query"
scope = "lines"
find = '''
    rows = db.fetch_all(
        "SELECT id, display_name FROM users WHERE display_name LIKE ? ORDER BY display_name LIMIT ?",
        (f"%{term}%", limit),
    )
'''
replace = '''
    rows = db.fetch_all(
        f"SELECT id, display_name FROM users WHERE display_name LIKE '%{term}%' ORDER BY display_name LIMIT ?",
        (limit,),
    )
'''

[[bug]]
id = "path-traversal-invoice"
file = "app/invoices.py"
kind = "security"
cwe = "CWE-22"
title = "Path traversal: user-supplied filename joined without containment check"
scope = "function"
find = '''
    base = (Path(config.INVOICE_DIR) / str(user_id)).resolve()
    path = (base / filename).resolve()
    if not path.is_relative_to(base):
        raise NotFound(filename)
    return path
'''
replace = '''
    base = Path(config.INVOICE_DIR) / str(user_id)
    return base / filename
'''

[[bug]]
id = "weak-password-hash"
file = "app/auth.py"
kind = "security"
cwe = "CWE-328"
title = "Passwords hashed with a single round of MD5"
scope = "lines"
find = '''
    digest = hashlib.pbkdf2_hmac("sha256", password.encode(), salt, config.PASSWORD_ITERATIONS)
'''
replace = '''
    digest = hashlib.md5(salt + password.encode()).digest()
'''

[[bug]]
id = "timing-unsafe-signature-check"
file = "app/auth.py"
kind = "security"
cwe = "CWE-208"
title = "Token signature compared with == (timing side channel)"
scope = "lines"
find = '''
    if not hmac.compare_digest(signature, _sign(payload.encode())):
'''
replace = '''
    if signature != _sign(payload.encode()):
'''

[[bug]]
id = "token-never-expires"
file = "app/auth.py"
kind = "security"
cwe = "CWE-613"
title = "Expiry written in milliseconds but checked in seconds - tokens practically never expire"
scope = "lines"
find = '''
        "exp": int(time.time()) + config.TOKEN_TTL_SECONDS,
'''
replace = '''
        "exp": int(time.time() * 1000) + config.TOKEN_TTL_SECONDS,
'''

[[bug]]
id = "predictable-reset-code"
file = "app/auth.py"
kind = "security"
cwe = "CWE-330"
title = "Password reset code derived from the current time"
scope = "function"
find = '''
    return secrets.token_urlsafe(24)
'''
replace = '''
    return hashlib.sha256(str(time.time()).encode()).hexdigest()[:12]
'''

[[bug]]
id = "hardcoded-secret-fallback"
file = "app/config.py"
kind = "security"
cwe = "CWE-798"
title = "Signing key falls back to a hard-coded default"
scope = "lines"
find = '''
SECRET_KEY = os.environ["SHOP_SECRET_KEY"]
'''
replace = '''
SECRET_KEY = os.environ.get("SHOP_SECRET_KEY", "change-me-in-production")
'''

[[bug]]
id = "missing-authorization-cancel"
file = "app/orders.py"
kind = "security"
cwe = "CWE-862"
title = "Any logged-in user can cancel (and refund) any order"
scope = "function"
find = '''
    order = _load(order_id)
    if order["user_id"] != user["sub"] and user["role"] != "admin":
        raise Forbidden("not your order")
    if order["status"] not in ("open", "paid"):
'''
replace = '''
    order = _load(order_id)
    if order["status"] not in ("open", "paid"):
'''

[[bug]]
id = "lockout-checked-after-password"
file = "app/users.py"
kind = "security"
cwe = "CWE-307"
title = "Lockout only checked after a correct password - brute force is never blocked and leaks success"
scope = "function"
find = '''
    if user["failed_logins"] >= config.MAX_LOGIN_ATTEMPTS:
        raise LoginBlocked("too many failed attempts, reset your password")
    if not auth.verify_password(password, user["password_hash"]):
        db.execute("UPDATE users SET failed_logins = failed_logins + 1 WHERE id = ?", (user["id"],))
        raise auth.AuthError("unknown user or wrong password")
'''
replace = '''
    if not auth.verify_password(password, user["password_hash"]):
        db.execute("UPDATE users SET failed_logins = failed_logins + 1 WHERE id = ?", (user["id"],))
        raise auth.AuthError("unknown user or wrong password")
    if user["failed_logins"] >= config.MAX_LOGIN_ATTEMPTS:
        raise LoginBlocked("too many failed attempts, reset your password")
'''

